[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "icarus"
version = "0.1.0"
description = "Machine learning for fusion simulation validation"
authors = [
  { name = "iomags2211", email = "isaac.magee@ukaea.uk" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3", 
    "License :: GNU LGPL",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26.0"
]

[project.urls]
"Repository" = "https://github.com/aurora-multiphysics/icarus"
"Issue Tracker" = "https://github.com/aurora-multiphysics/icarus/issues"

[tool.setuptools.packages.find]
where = ["src"]